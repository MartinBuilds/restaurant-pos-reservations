spring.application.name=restaurant-pos-reservations

# Copy this file as a reference when configuring local environment variables.
# Do not commit real credentials.

# Example environment variables:
# DB_URL=jdbc:mysql://localhost:3306/restaurant_management
# DB_USERNAME=restaurant_app
# DB_PASSWORD=change-me
# INITIAL_ADMIN_EMAIL=admin@example.com
# INITIAL_ADMIN_PASSWORD=replace_with_secure_password
# INITIAL_ADMIN_FULL_NAME=Restaurant Administrator

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_management}
spring.datasource.username=${DB_USERNAME:restaurant_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update is used until a dedicated migration tool is introduced
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# RESTAURANT_TIME_ZONE=Europe/Sofia
app.restaurant.time-zone=${RESTAURANT_TIME_ZONE:Europe/Sofia}
