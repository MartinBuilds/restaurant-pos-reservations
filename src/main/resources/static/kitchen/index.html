<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <title>Кухня — Restaurant POS</title>
  <link rel="stylesheet" href="/operations/css/operations.css">
</head>
<body class="kitchen-shell">
  <header class="kitchen-top">
    <div>
      <p class="brand-kicker">Restaurant POS</p>
      <h1 class="page-title">Кухненска опашка</h1>
      <p class="page-subtitle">ACCEPTED → COOKING → READY (REST е източник на истина)</p>
    </div>
    <div class="row">
      <div id="connection-status" class="conn" role="status" aria-live="polite"></div>
      <button type="button" class="btn btn-ghost" id="refresh-btn">Обнови</button>
      <button type="button" class="btn btn-ghost" id="logout-btn">Изход</button>
    </div>
  </header>
  <div class="status-region" id="status-region" role="status" aria-live="polite"></div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <main id="content" class="board" tabindex="-1"></main>
  <script type="module" src="/kitchen/js/app.js"></script>
</body>
</html>
