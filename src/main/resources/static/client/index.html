<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <title>Резервации — Restaurant POS</title>
  <script src="/shared/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/shared/css/theme.css?v=fix-tables-board-1">
  <link rel="stylesheet" href="/shared/css/badges.css?v=fix-badges-1">
  <link rel="stylesheet" href="/shared/css/shell.css?v=fix-toasts-1">
  <link rel="stylesheet" href="/client/css/client.css?v=fix-client-ui-1">
  <link rel="stylesheet" href="/shared/css/responsive-records.css?v=fix-toasts-1">
  <link rel="stylesheet" href="/shared/css/toasts.css?v=fix-toasts-2">
  <link rel="stylesheet" href="/shared/css/datetime-picker.css?v=fix-datetime-2">
  <link rel="stylesheet" href="/shared/css/page-refresh.css?v=fix-refresh-4">
</head>
<body>
  <div class="app-shell">
    <header class="top">
      <div class="brand">
        <p class="brand-kicker" data-i18n="app.brand">Restaurant POS</p>
        <h1 class="brand-title" data-i18n="client.brand">Онлайн резервации</h1>
      </div>
      <button type="button" class="btn btn-ghost nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="main-nav" data-i18n-aria="nav.menuToggle" aria-label="Меню"></button>
      <nav class="nav" id="main-nav" aria-label="Клиентска навигация" data-i18n-aria="nav.client">
        <a class="nav-link" href="#/availability" data-route="availability" data-i18n="nav.availability">Нова резервация</a>
        <a class="nav-link" href="#/reservations" data-route="reservations" data-i18n="nav.myReservations">Моите резервации</a>
        <div id="account-mount" class="account-mount client-account-slot"></div>
      </nav>
    </header>

    <div class="status-region" id="status-region" role="status" aria-live="polite"></div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <main class="content" id="content" tabindex="-1">
      <div class="page-head">
        <h2 class="page-title" id="page-title">Нова резервация</h2>
        <p class="page-subtitle" id="page-subtitle">Търсене на свободни маси</p>
      </div>
      <div id="view-root"></div>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <div class="dialog-header">
      <h2 class="dialog-title" id="dialog-title" data-i18n="common.dialog">Диалог</h2>
      <button type="button" class="btn btn-ghost dialog-close-btn" id="dialog-close" data-i18n-aria="common.close" aria-label="Затвори" title="Затвори">×</button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-footer" id="dialog-footer"></div>
  </div>

  <script type="module" src="/client/js/app.js?v=fix-refresh-4"></script>
</body>
</html>
