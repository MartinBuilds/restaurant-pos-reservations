spring.application.name=restaurant-pos-reservations

# Database (set DB_PASSWORD in the environment; do not hardcode secrets)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_management}
spring.datasource.username=${DB_USERNAME:restaurant_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
